<!DOCTYPE html>
<html>
<head><title>Voice Upload Test</title></head>
<body>
<h1>Test Voice Upload</h1>
<div id="voice-recorder-container"></div>
<script src="/js/jquery-3.7.0.min.js?a1114e5"></script>
<script src="/js/voice.message.js?a1114e5"></script>
<script>
$(function() {
    $('#voice-recorder-container').voicerecorder({
        uploadUrl: 'ajax.php/form/upload/ticket/attach',
        formId: 'ticket',
        uploadFieldId: 'ticket/attach',
        autoUpload: false
    });
    
    // Get the recorder instance and trigger upload with a dummy blob
    setTimeout(function() {
        var recorder = $('#voice-recorder-container').data('voicerecorder');
        if (recorder) {
            recorder.audioBlob = new Blob(['test'], {type: 'audio/webm'});
            recorder.upload(
                function(json) { console.log('Success:', json); },
                function() { console.log('Error'); }
            );
        }
    }, 1000);
});
</script>
</body>
</html>
